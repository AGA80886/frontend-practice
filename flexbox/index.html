<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlexBox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@100;300;400;900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Noto Sans", sans-serif;
      }

      .navbar {
        width: 100%;
        height: 100px;
        background: #ccc;
        display: flex;
        align-items: center;
        justify-content: center;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 10;
      }

      .title {
        display: flex;
        font-family: "Londrina Solid", sans-serif;
        justify-content: center;
        font-size: 4rem;
        font-weight: 500;
        flex-grow: 3;
      }

      .nav-links {
        display: flex;
        align-items: center;
        gap: 80px;
        flex-grow: 1;
      }

      .icon,
      .hamburger {
        cursor: pointer;
        font-weight: 500;
      }

      .container1 {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        width: 100%;
        min-height: 100vh;
        background: lightgoldenrodyellow;

        padding-top: 50px;
      }

      .container1 h1 {
        font-size: 3.5rem;
        font-family: "Londrina Solid", sans-serif;
      }

      .container1 p {
        margin-bottom: 80px;
      }

      .container2 {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        width: 100%;
        min-height: 100vh;
        background: lightcyan;

        padding-top: 50px;
      }

      .container2 h1 {
        font-size: 3.5rem;
        font-family: "Londrina Solid", sans-serif;
      }

      .container2 p {
        margin-bottom: 80px;
      }

      .pic,
      .pic2 {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
      }

      .pic2 {
        margin-top: 20px;
      }

      .footer {
        width: 100%;
        height: 100px;
        line-height: 100px;
        text-align: center;
      }

      @media (max-width: 1024px) {
        .navbar {
          height: 80px;
          padding: 0 20px;
        }

        .title {
          font-size: 2rem;
        }

        .nav-links {
          gap: 15px;
        }

        .nav-links .icon {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="navbar">
      <div class="title">The Quiet Archive</div>
      <div class="nav-links">
        <div class="icon">Essays</div>
        <div class="icon">Fragments</div>
        <div class="icon">Gallery</div>
        <div class="icon">About</div>
        <button class="hamburger">
          <i class="fa-solid fa-bars fa-2x"></i>
        </button>
      </div>
    </div>

    <div class="container1">
      <h1>時間的碎片</h1>
      <p>在繁華中尋找一絲靜謐</p>
      <img src="https://picsum.photos/350/350/?random=10" alt="Gallery image 1" />
    </div>

    <div class="container2">
      <h1>Visual Gallery</h1>
      <p>捕捉那些無法言說的瞬間</p>
      <div class="pic">
        <img src="https://picsum.photos/350/350/?random=1" alt="Gallery image 2" />
        <img src="https://picsum.photos/350/350/?random=2" alt="Gallery image 3"/>
        <img src="https://picsum.photos/350/350/?random=3" alt="Gallery image 4"/>
      </div>
      <div class="pic2">
        <img src="https://picsum.photos/350/350/?random=10" alt="Gallery image 5"/>
      </div>
    </div>

    <div class="footer">Copyright © 2026 TingChia. All rights reserved.</div>
  </body>
</html>
